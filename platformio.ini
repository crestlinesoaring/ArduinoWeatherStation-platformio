; PlatformIO project for the ArduinoWeatherStation.
;   src/            - sketch sources (merged like the Arduino IDE: main .ino first, then alphabetically)
;   libraries/      - vendored third-party libraries, committed directly in the repo
;   platformio.ini  - this file
;
; `mega` is the default target and uses the station values compiled into
; src/Marshall.h as-is. `mega_tavis` is the same build but forces Tavis' station
; settings via build_flags. `pio run` builds the default env only,
; `pio run -e <env>` builds a specific one, `pio run -t upload` flashes it.
;
[platformio]
src_dir = src
default_envs = mega

[monitor_defaults]
monitor_speed = 115200
monitor_filters = default, log2file_env

############ The base target is for Marshall site with all defines in Marshall.h
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts =
    pre:git_rev.py
    post:scripts/pio_hex_to_bin.py
    post:scripts/pio_eeprom_blank.py

; Vendored libraries committed directly under ./libraries (not submodules).
lib_extra_dirs = libraries

; Ethernet from the Library Manager, pinned like the old sketch.yaml entry.
lib_deps =
    arduino-libraries/Ethernet@2.0.2

monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}

; Feature toggles. Station settings are NOT set here: this env uses the defaults
; compiled into src/Marshall.h.
build_flags =
    -D ANEMO_WS85
    -D DONT_SLEEP
    ; -D BENCH_MODE
    ; -D ENABLE_HARDWARE_SIMULATION
    ; -D WS85_SERIAL_LOG

[env:gb5_lab]
extends = env:mega
; monitor_port = COM3
; upload_port = COM5
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
build_flags =
    ${env:mega.build_flags}

    -D WX_OWNER='"J"'

    ; Hardware version: "5" is at Mom, "6" is at W15, "7" is with Tavis
    -D HW_VERSION='"5"'

    ; Battery type: 'F' = LiFePo, 'A' = absorbant glass mat (AGM).
    ; Determines critical battery voltage. Default is AGM.
    ; -D BATTERY_AGM
    -D BATTERY_LIFEPO

    ; Data destination subfolder: where the station sends its data
    -D WX_BETA_TEXT='"betaOne"'

    ; Station network: gateway last octet, subnet (3rd octet), device IP last octet
    ; e.g. IP 192.168.2.227, gateway 192.168.2.1, subnet 255.255.255.0
    -D IP_GW=254
    -D IP_Q3=222    ; Marshall subnet (3rd octet)
    ; -D IP_WX=227
    ; -D IP_WX=222    ; production MWX
    -D IP_WX=222    ; Brain number 5 (with Dj)
    ; -D IP_WX=226    ; Brain number 6 (with Dj)

    ; MAC last octet (DE:AD:BE:EF:02:xx). Defaults to IP_WX. Same define as main firmware.
    -D MAC_6=222

; One-shot Athena EEPROM network writer (used by: pio run -e gb5_lab -t eeprom-net)
[env:gb5_lab-eeprom-net]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_writer_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
build_flags =
    -D IP_GW=254
    -D IP_Q3=222
    -D IP_WX=222
lib_deps =
    https://github.com/embeddedartistry/AthenaEEPROM.git

[env:gb6_lab]
extends = env:mega
monitor_port = COM3
upload_port = COM5
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
build_flags =
    ${env:mega.build_flags}

    -D WX_OWNER='"J"'

    ; Hardware version: "5" is at Mom, "6" is at W15, "7" is with Tavis
    -D HW_VERSION='"6"'

    ; Battery type: 'F' = LiFePo, 'A' = absorbant glass mat (AGM).
    ; Determines critical battery voltage. Default is AGM.
    ; -D BATTERY_AGM
    ; -D BATTERY_LIFEPO

    ; Data destination subfolder: where the station sends its data
    -D WX_BETA_TEXT='"betaThree"'

    ; Station network: gateway last octet, subnet (3rd octet), device IP last octet
    ; e.g. IP 192.168.2.227, gateway 192.168.2.1, subnet 255.255.255.0
    -D IP_GW=254
    -D IP_Q3=222    ; Marshall subnet (3rd octet)
    ; -D IP_WX=227
    ; -D IP_WX=222    ; production MWX
    ; -D IP_WX=225    ; Brain number 5 (with Dj)
    -D IP_WX=226    ; Brain number 6 (with Dj)

    ; MAC last octet (DE:AD:BE:EF:02:xx). Defaults to IP_WX. Same define as main firmware.
    ; -D MAC_6=226

; One-shot Athena EEPROM network writer (used by: pio run -e gb6_lab -t eeprom-net)
[env:gb6_lab-eeprom-net]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_writer_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
build_flags =
    -D IP_GW=254
    -D IP_Q3=222
    -D IP_WX=226
lib_deps =
    https://github.com/embeddedartistry/AthenaEEPROM.git

[env:tavis]
extends = env:mega
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
build_flags =
    ${env:mega.build_flags}

    -D WX_OWNER='"T"'

    ; Hardware version: "5" is at Mom, "6" is at W15, "7" is with Tavis
    -D HW_VERSION='"7"'

    ; Battery type: 'F' = LiFePo, 'A' = absorbant glass mat (AGM).
    ; Determines critical battery voltage. Default is AGM.
    ; -D BATTERY_AGM
    ; -D BATTERY_LIFEPO

    ; Data destination subfolder: where the station sends its data
    -D WX_BETA_TEXT='"betaTwo"'

    ; Station network: gateway last octet, subnet (3rd octet), device IP last octet
    ; e.g. IP 192.168.2.227, gateway 192.168.2.1, subnet 255.255.255.0
    -D IP_GW=1
    -D IP_Q3=2
    ; -D IP_Q3=222    ; Marshall subnet (3rd octet)
    -D IP_WX=227
    ; -D IP_WX=222    ; production MWX
    ; -D IP_WX=225    ; Brain number 5 (with Dj)
    ; -D IP_WX=226    ; Brain number 6 (with Dj)

    ; MAC last octet (DE:AD:BE:EF:02:xx). Defaults to IP_WX. Same define as main firmware.
    ; -D MAC_6=227

; One-shot Athena EEPROM network writer (used by: pio run -e tavis -t eeprom-net)
[env:tavis-eeprom-net]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_writer_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
build_flags =
    -D IP_GW=1
    -D IP_Q3=2
    -D IP_WX=227
lib_deps =
    https://github.com/embeddedartistry/AthenaEEPROM.git