; PlatformIO project for the ArduinoWeatherStation.
;   platformio/       - per-target env definitions (included below)
;
; `mega` is the default target (Marshall.h). Lab envs override site settings via
; build_flags in platformio/*.ini.
;
;   pio run                    - build default env (mega)
;   pio run -e <env> -t upload - flash
;   pio run -e <lab-env> -t eeprom-net - Athena EEPROM writer (see platformio/<env>.ini)
;
[platformio]
src_dir = src
default_envs = mega
extra_configs =
    platformio/mega.ini
    platformio/gb5_lab.ini
    platformio/gb6_lab.ini
    platformio/tavis.ini
    platformio/renogy_test.ini

[monitor_defaults]
monitor_speed = 115200
monitor_filters = default, log2file_env
