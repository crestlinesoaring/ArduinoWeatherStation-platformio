; PlatformIO project for the ArduinoWeatherStation.
;   src/            - sketch sources (merged like the Arduino IDE: main .ino first, then alphabetically)
;   libraries/      - vendored third-party libraries, committed directly in the repo
;   platformio.ini  - this file
;
; `mega` is the default target and uses the station values compiled into
; src/Marshall.h as-is. `mega_tavis` is the same build but forces Tavis' station
; settings via build_flags. `pio run` builds the default env only,
; `pio run -e <env>` builds a specific one, `pio run -t upload` flashes it.
;
[platformio]
src_dir = src
default_envs = mega

[monitor_defaults]
; Also passed to firmware as SERIAL_MONITOR_BAUD (git_rev.py) for Serial.begin().
monitor_speed = 115200
monitor_filters = default, log2file_env

############ The base target is for Marshall site with all defines in Marshall.h
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
; Skip avrdude verify pass after flash (faster uploads; write-only).
upload_flags = -V
extra_scripts =
    pre:git_rev.py
    post:scripts/pio_hex_to_bin.py
    post:scripts/pio_eeprom_blank.py

; Vendored libraries committed directly under ./libraries (not submodules).
lib_extra_dirs = libraries

; Ethernet from the Library Manager, pinned like the old sketch.yaml entry.
lib_deps =
    arduino-libraries/Ethernet@2.0.2
    4-20ma/ModbusMaster@^2.0.1

monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}

; Feature toggles. Station settings are NOT set here: this env uses the defaults
; compiled into src/Marshall.h.
build_flags =
    -D ANEMO_WS85
    -D SERIAL_TIMESTAMPS

[env:gb5_lab]
extends = env:mega
monitor_port = COM16
upload_port = COM16
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
    post:scripts/pio_tftp_upload.py
    post:scripts/pio_telnet_snipe.py
build_flags =
    ${env:mega.build_flags}

    -D WX_OWNER='"J"'
    -D HW_VERSION='"5"'
    -D BATTERY_AGM
    ;-D BATTERY_LIFEPO

    -D WX_BETA_TEXT='"betaOne"'

    -D IP_GW=254
    -D IP_Q3=222    ; Marshall subnet (3rd octet)
    -D IP_WX=222    ; Brain number 5 (with Dj)

    -D MAC_6=222

[env:gb6_lab]
extends = env:mega
monitor_port = COM10
upload_port = COM19
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
    post:scripts/pio_tftp_upload.py
    post:scripts/pio_telnet_snipe.py
build_flags =
    ${env:mega.build_flags}

    -D DONT_SLEEP
    -D RENOGY_POLLING_ENABLED
    -D WX_OWNER='"J"'
    -D HW_VERSION='"6"'
    ; -D BATTERY_AGM
    -D BATTERY_LIFEPO
    -D WX_BETA_TEXT='"betaThree"'
    -D WX_BETA_CODE='"b3"'
    -D IP_GW=254
    -D IP_Q3=222    ; Marshall subnet (3rd octet)
    -D IP_WX=226    ; Brain number 6 (with Dj)
    -D MAC_6=226

[env:tavis]
extends = env:mega
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
    post:scripts/pio_tftp_upload.py
    post:scripts/pio_telnet_snipe.py
build_flags =
    ${env:mega.build_flags}
    
    -D DONT_SLEEP=1

    -D WX_OWNER='"T"'
    -D HW_VERSION='"7"'
    -D WX_BETA_TEXT='"betaTwo"'
    -D WX_BETA_CODE='"b2"'
    -D IP_GW=1
    -D IP_Q3=2
    -D IP_WX=227
    ; -D MAC_6=227

