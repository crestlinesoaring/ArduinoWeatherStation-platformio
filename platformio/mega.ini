; Default station firmware (Marshall.h site settings). Lab envs extend this.
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_flags = -V
extra_scripts =
    pre:git_rev.py
    post:scripts/pio_hex_to_bin.py
    post:scripts/pio_eeprom_blank.py
    post:scripts/pio_eeprom_test.py

lib_extra_dirs = libraries

lib_deps =
    arduino-libraries/Ethernet@2.0.2
    4-20ma/ModbusMaster@^2.0.1

monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}

build_flags =
    -D ANEMO_WS85
    -D SERIAL_TIMESTAMPS

; One-shot EEPROM cell test sketch (pio run -e gb6_lab -t eeprom-test)
[env:mega-eeprom-test]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_test_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
