[env:gb6_lab]
extends = env:mega
monitor_port = COM19
upload_port = COM10
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
    post:scripts/pio_tftp_upload.py
    post:scripts/pio_telnet_snipe.py
build_flags =
    ${env:mega.build_flags}

    -D DONT_SLEEP
    -D RENOGY_POLLING_ENABLED
    -D WX_OWNER='"J"'
    -D HW_VERSION='"6"'
    ; -D BATTERY_AGM
    -D BATTERY_LIFEPO
    -D WX_BETA_TEXT='"betaThree"'
    -D WX_BETA_CODE='"b3"'
    -D IP_GW=254
    -D IP_Q3=222
    -D IP_WX=226
    -D MAC_6=226

; One-shot Athena EEPROM network writer (pio run -e gb6_lab -t eeprom-net)
[env:gb6_lab-eeprom-net]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_writer_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
build_flags =
    -D IP_GW=254
    -D IP_Q3=222
    -D IP_WX=226
lib_deps =
    https://github.com/embeddedartistry/AthenaEEPROM.git
