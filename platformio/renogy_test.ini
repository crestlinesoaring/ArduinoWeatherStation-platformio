; Standalone Renogy Modbus test sketch (src/renogy-test/).
[env:renogy_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_renogy_test_env.py
upload_flags = -V
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
