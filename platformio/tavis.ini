[env:tavis]
extends = env:mega
extra_scripts =
    ${env:mega.extra_scripts}
    post:scripts/pio_eeprom_net.py
    post:scripts/pio_tftp_upload.py
    post:scripts/pio_telnet_snipe.py
build_flags =
    ${env:mega.build_flags}

    -D DONT_SLEEP=1
    -D RENOGY_POLLING_ENABLED
    -D WX_OWNER='"T"'
    -D HW_VERSION='"7"'
    -D WX_BETA_TEXT='"betaTwo"'
    -D WX_BETA_CODE='"b2"'
    -D IP_GW=1
    -D IP_Q3=2
    -D IP_WX=227
    ; -D MAC_6=227

; One-shot Athena EEPROM network writer (pio run -e tavis -t eeprom-net)
[env:tavis-eeprom-net]
platform = atmelavr
board = megaatmega2560
framework = arduino
extra_scripts = pre:scripts/pio_eeprom_writer_env.py
monitor_speed = ${monitor_defaults.monitor_speed}
monitor_filters = ${monitor_defaults.monitor_filters}
build_flags =
    -D IP_GW=1
    -D IP_Q3=2
    -D IP_WX=227
lib_deps =
    https://github.com/embeddedartistry/AthenaEEPROM.git
